[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-master"
version = "1.0.0"
description = "A precision chess desktop studio built with Python, PyWebView and Chessground."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chess Master" }]
dependencies = [
    "python-chess>=1.11",
    "pywebview>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chess-master = "chess_master.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_master = [
    "web/index.html",
    "web/assets/**/*",
    "analysis/*.tsv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "engine: integration tests that launch the real Stockfish process",
]
